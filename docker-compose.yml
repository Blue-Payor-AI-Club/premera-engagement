services:
  portal:
    build: .
    container_name: premera-portal
    ports:
      - "8082:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    # nginx proxies /api to the premeraapi container by name, so join the API project's network.
    networks: [default, api]
    restart: unless-stopped

networks:
  api:
    external: true
    name: api_default
