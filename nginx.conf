server {
    listen 80;
    # HTTPS on the server itself (WAF requirement). The cert lives on the server, not in git:
    # deploy.sh creates a self-signed one in web/certs/ if none is there; drop in the CA-issued
    # server.crt/server.key to replace it.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API on the same origin, so the WAF only fronts one site on 443 (no second port, no CORS,
    # no mixed content). host.docker.internal = the Docker host, where the API publishes 8083.
    # /api/x is the API's /v1/x.
    location /api/ {
        proxy_pass http://host.docker.internal:8083/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # Required for React Router (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
